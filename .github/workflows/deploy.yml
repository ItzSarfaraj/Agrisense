name: Deploy AgriSense

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never run two deployments at once.
concurrency:
  group: deploy-agrisense
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::820381490998:role/AgriSenseGitHubActionsRole
  ECR_REGISTRY: 820381490998.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: agrisense-cluster
  ALB_NAME: agrisense-alb

jobs:
  # 1. Cheap checks first, so a broken commit never reaches AWS.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Client builds
        working-directory: client
        env:
          VITE_API_URL: http://example.invalid/api
        run: |
          npm ci
          npm run build

      - name: Server code has no syntax errors
        working-directory: server
        run: |
          npm ci --omit=dev
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python services have no syntax errors
        run: python -m compileall -q genai-service/app ml-service/app

  # 2. Build the four images in parallel and push them to ECR.
  build:
    name: Build ${{ matrix.service }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: client
            context: ./client
            repo: agrisense-client
          - service: server
            context: ./server
            repo: agrisense-server
          - service: ml
            context: ./ml-service
            repo: agrisense-ml
          - service: genai
            context: ./genai-service
            repo: agrisense-genai
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # The React app has the API address baked in at build time, so look up
      # the current load balancer instead of hard-coding an address.
      - name: Find the load balancer address
        if: matrix.service == 'client'
        id: alb
        run: |
          dns=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text) || {
            echo "::error::Load balancer $ALB_NAME not found. Create it first (deployment step 5)."
            exit 1
          }
          echo "api_url=http://$dns/api" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}
          build-args: |
            ${{ matrix.service == 'client' && format('VITE_API_URL={0}', steps.alb.outputs.api_url) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 3. Tell ECS to start fresh tasks from the new images, then test the site.
  deploy:
    name: Deploy to ECS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start new deployments
        run: |
          for s in client server ml genai; do
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "agrisense-$s" --force-new-deployment --no-cli-pager > /dev/null
            echo "deployment started: agrisense-$s"
          done

      - name: Is the app switched on?
        id: state
        run: |
          desired=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services agrisense-server --query 'services[0].desiredCount' --output text)
          echo "desired=$desired" >> "$GITHUB_OUTPUT"
          if [ "$desired" = "0" ]; then
            echo "::notice::Services are scaled to 0, so the new images are in ECR but no tasks were started."
          fi

      - name: Wait until the services are stable
        if: steps.state.outputs.desired != '0'
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services agrisense-client agrisense-server agrisense-ml agrisense-genai

      - name: Smoke test the live site
        if: steps.state.outputs.desired != '0'
        run: |
          dns=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text)
          site=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 "http://$dns/")
          api=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://$dns/api/recommendations/insights")
          echo "site=$site (expected 200), api without login=$api (expected 401)"
          [ "$site" = "200" ] && [ "$api" = "401" ]
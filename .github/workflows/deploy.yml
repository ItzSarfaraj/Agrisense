name: Deploy AgriSense

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "820381490998"
  ECS_CLUSTER: agrisense-cluster

jobs:
  deploy-client:
    name: Deploy Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::820381490998:role/AgriSenseGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push client image
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          docker build \
            --build-arg VITE_API_URL=http://agrisense-alb-1672199196.ap-south-1.elb.amazonaws.com/api \
            -t $ECR_REGISTRY/agrisense-client:latest \
            ./client

          docker push \
            $ECR_REGISTRY/agrisense-client:latest

      - name: Deploy client to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service agrisense-client \
            --force-new-deployment \
            --region $AWS_REGION

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services agrisense-client \
            --region $AWS_REGION
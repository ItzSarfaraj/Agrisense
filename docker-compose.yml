services:

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: agrisense-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: agrisense-server
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      ML_SERVICE_URL: http://ml-service:8000
      GENAI_SERVICE_URL: http://genai-service:8000
    ports:
      - "5000:5000"
    depends_on:
      - ml-service
      - genai-service
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    container_name: agrisense-ml
    ports:
      - "8000:8000"
    restart: unless-stopped

  genai-service:
    build:
      context: ./genai-service
      args:
        # Set to "true" only if you use LLM_PROVIDER=gemini
        INSTALL_GEMINI: "false"
    container_name: agrisense-genai
    env_file:
      - path: ./genai-service/.env
        required: false
    environment:
       
      # Ollama runs natively on the host (better speed, no extra RAM in Docker)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
       
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    restart: unless-stopped